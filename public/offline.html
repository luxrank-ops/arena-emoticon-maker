<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7C4DFF" />
  <title>오프라인 · 이모티학</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F8F9FA;color:#1A237E;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:100%;max-width:420px;padding:32px 24px;text-align:center;background:#fff;border:1px solid #E4E1EF;border-radius:24px;box-shadow:0 16px 40px rgba(26,35,126,.10)}.icon{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 20px;border-radius:20px;background:#EDE4FF;font-size:34px}h1{margin:0;font-size:25px;line-height:1.3}p{margin:14px 0 0;color:#62657A;font-size:15px;line-height:1.7;word-break:keep-all}button{width:100%;min-height:52px;margin-top:24px;border:0;border-radius:14px;background:#7C4DFF;color:#fff;font:inherit;font-weight:800;cursor:pointer}small{display:block;margin-top:16px;color:#777B90;line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>인터넷 연결을 확인해 주세요</h1>
    <p>현재 오프라인 상태입니다. 사진과 생성 결과를 새로 불러오지는 못하지만, 작성 중이던 세션 사진은 현재 탭에 유지될 수 있습니다.</p>
    <button type="button" onclick="location.reload()">연결 후 다시 시도</button>
    <small>개인 사진, 인증 응답, 공유 결과는 오프라인 캐시에 저장하지 않습니다.</small>
  </main>
</body>
</html>
