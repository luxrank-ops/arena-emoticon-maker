<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이모티콘 제작 앱 (Arena AI)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: "Pretendard", sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-6">
            <span class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Arena AI Project</span>
            <h1 class="text-2xl font-bold text-slate-900 mt-3">🎨 나만의 이모티콘 제작 앱</h1>
            <p class="text-slate-500 text-sm mt-1">캐릭터와 감정을 입력하고 나만의 이모티콘 이미지를 만들어 보세요</p>
        </div>
        
        <div class="space-y-4 mb-6 p-4 bg-slate-50 rounded-xl border border-slate-200">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">🔑 Gemini API Key 설정</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" placeholder="Gemini API 키 입력" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <button onclick="clearApiKey()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">삭제</button>
                </div>
                <p id="keyStatus" class="text-[11px] text-slate-600 mt-2">키는 저장하지 않으며 Google에 직접 전송됩니다. 생성에 API 사용 요금이 발생할 수 있습니다.</p>
            </div>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">캐릭터 이름 / 컨셉</label>
                <input type="text" id="charName" value="새싹이 달린 말랑 캐릭터" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">표정 및 감정 선택</label>
                <select id="emotion" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    <option>기쁨 (엄지척, 미소)</option>
                    <option>열정 (불타오름, 파이팅)</option>
                    <option>슬픔/당황 (동공지진, 눈물 왈칵)</option>
                    <option>최고/인정 (홀드를 다 가져가야겠냐?)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">대사 입력</label>
                <input type="text" id="dialogue" value="사랑합니다! ❤️" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
            </div>
            <button id="generateButton" onclick="generateImage()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition shadow-md text-sm">
                ✨ 이모티콘 이미지 만들기
            </button>
        </div>

        <div id="resultBox" class="mt-6 hidden bg-slate-100 rounded-xl p-4 border border-slate-200" aria-live="polite">
            <h3 class="text-sm font-bold text-indigo-600 mb-3">완성된 이모티콘</h3>
            <img id="resultImage" alt="생성된 이모티콘" class="w-full rounded-lg bg-white" />
            <a id="downloadImage" download="emoticon.png" class="mt-4 block text-center bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 rounded-lg text-sm">이미지 다운로드</a>
        </div>
        <p id="status" role="status" aria-live="polite" class="mt-4 text-sm text-slate-600"></p>
    </div>

    <script>
        // Remove keys saved by the older version; keys are now kept only in the input.
        try { localStorage.removeItem("gemini_api_key"); } catch (_) {}
        function clearApiKey() {
            document.getElementById("apiKeyInput").value = "";
            try { localStorage.removeItem("gemini_api_key"); } catch (_) {}
            document.getElementById("keyStatus").textContent = "API 키를 삭제했습니다.";
        }

        document.getElementById("apiKeyInput").addEventListener("input", () => {
            document.getElementById("keyStatus").textContent = "키는 저장하지 않으며 Google에 직접 전송됩니다. 생성에 API 사용 요금이 발생할 수 있습니다.";
        });

        async function generateImage() {
            const apiKey = document.getElementById("apiKeyInput").value.trim();
            const name = document.getElementById("charName").value.trim();
            const emotion = document.getElementById("emotion").value;
            const dialogue = document.getElementById("dialogue").value.trim();
            const status = document.getElementById("status");
            const button = document.getElementById("generateButton");
            if (!apiKey || !name) {
                status.textContent = "Gemini API 키와 캐릭터 컨셉을 입력해 주세요.";
                return;
            }
            button.disabled = true;
            button.classList.add("opacity-50");
            status.textContent = "이모티콘을 만들고 있어요. 잠시만 기다려 주세요...";
            document.getElementById("resultBox").classList.add("hidden");
            try {
                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Create one cute, high-quality emoticon sticker image. Character concept: ${name}. Expression and emotion: ${emotion}. ${dialogue ? `Include this exact Korean text if possible: ${dialogue}.` : "No text."} Center a single character on a clean white background, with a clear silhouette and expressive pose.` }] }],
                        generationConfig: { responseModalities: ["TEXT", "IMAGE"] }
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    if (response.status === 429) {
                        const detail = data.error?.message || "";
                        const zeroQuota = /limit:\s*0(?:\D|$)/i.test(detail);
                        throw new Error(zeroQuota
                            ? "이 Google 프로젝트의 이미지 생성 무료 할당량이 0입니다. Google AI Studio에서 이 API 키가 속한 프로젝트의 결제 설정과 해당 모델의 사용 한도를 확인해 주세요. 유료 사용 시 요금이 발생할 수 있습니다."
                            : "이미지 생성 사용 한도에 도달했습니다. Google AI Studio에서 사용량과 한도를 확인하고, 일시적 제한이라면 잠시 후 다시 시도해 주세요.");
                    }
                    if (response.status === 400 || response.status === 401 || response.status === 403) {
                        throw new Error("API 키 또는 이 모델의 사용 권한을 확인해 주세요. 이미지 생성 기능에 접근할 수 있는 Gemini API 키가 필요합니다.");
                    }
                    throw new Error(`Google 이미지 생성 요청 실패 (HTTP ${response.status}). 잠시 후 다시 시도해 주세요.`);
                }
                const image = data.candidates?.flatMap(candidate => candidate.content?.parts || []).find(part => part.inlineData?.data)?.inlineData;
                if (!image || !image.mimeType?.startsWith("image/")) throw new Error("이미지가 반환되지 않았습니다. 입력 내용을 바꾸어 다시 시도해 주세요.");
                const imageUrl = `data:${image.mimeType};base64,${image.data}`;
                document.getElementById("resultImage").src = imageUrl;
                const download = document.getElementById("downloadImage");
                download.href = imageUrl;
                download.download = `emoticon.${image.mimeType === "image/jpeg" ? "jpg" : "png"}`;
                document.getElementById("resultBox").classList.remove("hidden");
                status.textContent = "이미지가 완성됐어요! 글자가 정확하지 않다면 다시 생성해 보세요.";
            } catch (error) {
                status.textContent = `이미지 생성에 실패했습니다. ${error.message || "네트워크 연결을 확인하고 다시 시도해 주세요."}`;
            } finally {
                button.disabled = false;
                button.classList.remove("opacity-50");
            }
        }

    </script>
</body>
</html>
