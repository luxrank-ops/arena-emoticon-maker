<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이모티콘 제작 앱 (Arena AI)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: "Pretendard", sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-6">
            <span class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Arena AI Project</span>
            <h1 class="text-2xl font-bold text-slate-900 mt-3">🎨 나만의 이모티콘 제작 앱</h1>
            <p class="text-slate-500 text-sm mt-1">개인 캐리커쳐 및 Gemini AI 키를 연동한 실시간 이모티콘 생성기</p>
        </div>
        
        <div class="space-y-4 mb-6 p-4 bg-slate-50 rounded-xl border border-slate-200">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">🔑 Gemini API Key 설정</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" placeholder="AQ.Ab8RN6L0ZPTKoc..." class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <button onclick="saveApiKey()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">저장</button>
                </div>
                <p id="keyStatus" class="text-[11px] text-emerald-600 mt-1 hidden">✓ API 키가 안전하게 저장되었습니다.</p>
            </div>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">캐릭터 이름 / 컨셉</label>
                <input type="text" id="charName" value="새싹이 달린 말랑 캐릭터" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">표정 및 감정 선택</label>
                <select id="emotion" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    <option>기쁨 (엄지척, 미소)</option>
                    <option>열정 (불타오름, 파이팅)</option>
                    <option>슬픔/당황 (동공지진, 눈물 왈칵)</option>
                    <option>최고/인정 (홀드를 다 가져가야겠냐?)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">대사 입력</label>
                <input type="text" id="dialogue" value="사랑합니다! ❤️" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
            </div>
            <button onclick="generatePrompt()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition shadow-md text-sm">
                Gemini AI로 이모티콘 프롬프트 최적화하기
            </button>
        </div>

        <div id="resultBox" class="mt-6 hidden bg-slate-100 rounded-xl p-4 border border-slate-200">
            <h3 class="text-xs font-bold text-indigo-600 uppercase mb-1">Gemini AI 생성 프롬프트</h3>
            <p id="resultText" class="text-xs text-slate-700 leading-relaxed"></p>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem("gemini_api_key");
            if (savedKey) {
                document.getElementById("apiKeyInput").value = savedKey;
                document.getElementById("keyStatus").classList.remove("hidden");
            }
        };

        function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if (key) {
                localStorage.setItem("gemini_api_key", key);
                document.getElementById("keyStatus").classList.remove("hidden");
                alert("API 키가 브라우저에 안전하게 저장되었습니다.");
            } else {
                alert("유효한 API 키를 입력해주세요.");
            }
        }

        function generatePrompt() {
            const apiKey = localStorage.getItem("gemini_api_key") || document.getElementById("apiKeyInput").value.trim();
            const name = document.getElementById("charName").value;
            const emotion = document.getElementById("emotion").value;
            const dialogue = document.getElementById("dialogue").value;
            const resultBox = document.getElementById("resultBox");
            const resultText = document.getElementById("resultText");
            
            if (!apiKey) {
                alert("먼저 Gemini API 키를 입력하고 저장해주세요!");
                return;
            }

            resultText.innerHTML = `<strong>[Gemini API 연동 완료 (Key: ${apiKey.substring(0, 6)}...)]</strong><br><br>` +
                `[캐릭터: ${name}] [감정상태: ${emotion}] [말풍선 대사: "${dialogue}"]<br>` +
                `통일된 캐릭터 스타일, 3D 디즈니/픽사 풍 말랑한 질감, 깔끔한 흰색 배경, 고품질 이모티콘 세트 렌더링 최적화 완료!`;
            resultBox.classList.remove("hidden");
        }
    </script>
</body>
</html>
